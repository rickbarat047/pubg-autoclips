[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pubg-autoclips"
version = "1.0.0"
description = "Local-first PUBG gameplay highlight detection and short-form video generator"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "PUBG AutoClips contributors" }]
dependencies = [
    "PySide6>=6.6,<7",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "Pydantic>=2.5,<3",
    "platformdirs>=4.0,<5",
    "opencv-python>=4.9,<5",
    "rapidocr_onnxruntime>=1.3,<2",
    "onnxruntime>=1.16,<2",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pytest-qt>=4.2,<5", "pytest-cov>=4.1,<6"]

[project.scripts]
pubg-autoclips = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "gui: tests requiring Qt display (skipped in headless CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
